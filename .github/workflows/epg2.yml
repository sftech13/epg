name: Run EPG2

on:
  schedule:
    - cron: "0 */12 * * *"   # Every 12 hours
  workflow_dispatch: 

permissions:
  contents: write 

jobs:
  run-epg:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo (with LFS)
        uses: actions/checkout@v4
        with:
          lfs: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull LFS files (safeguard)
        run: git lfs pull

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install requests

      - name: Run epg2.py
        working-directory: ./
        run: python epg2.py --profiles

      - name: Commit and push EPG files
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          # Force add all EPG files (gzipped outputs from multi-profile mode)
          git add -f output/EPG*.xml.gz output/epg.log || echo "Nothing to add"
          git commit -m "Auto-update EPG feed" || echo "No changes to commit"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

